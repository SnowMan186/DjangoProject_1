{% extends 'base.html' %}

{% block content %}
    <h1>Подтверждение удаления продукта</h1>
    <p>Вы уверены, что хотите удалить продукт "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'catalog:product_list' %}">Нет, отменить</a>
    </form>
{% endblock %}
